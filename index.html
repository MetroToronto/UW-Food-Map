<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UW Food Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Website and popup styling -->
    <link rel="stylesheet" href="mapstyle.css">
    <link rel="stylesheet" href="popupstyle.css">
</head>
<body>
    <main class="map-layout">
        <!-- Full-screen map -->
        <div id="map" aria-label="University of Waterloo food locations map"></div>

        <!-- Branding overlay in the top-left of the map -->
        <div class="map-branding">
            <div class="map-logo-box">
                <img
                    src="icons/WUSA_Primary_Logo.png"
                    alt="WUSA logo"
                    class="wusa-logo"
                >
            </div>

            <div class="map-title-box">
                <h1>UW Food Map</h1>
                <p>Explore food options at the University of Waterloo</p>
            </div>
        </div>
    </main>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Popup functions must load before basemap.js -->
    <script src="popup.js"></script>
    <script src="basemap.js"></script>
</body>
</html>
